[workspace]
members = [
    "crates/protocol",
    "crates/client",
    "crates/broker",
    "crates/supervisor",
    "crates/auth",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.94.0"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/tokimo-lab/tokimo-bus"
authors      = ["Tokimo Lab"]

[workspace.dependencies]
tokio          = { version = "1.38", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "process", "signal", "fs"] }
serde          = { version = "1", features = ["derive"] }
rmp-serde      = "1.3"
thiserror      = "1.0"
tracing        = "0.1"
parking_lot    = "0.12"
dashmap        = "6"
futures        = "0.3"
async-trait    = "0.1"

tokimo-bus-protocol   = { path = "crates/protocol",   version = "0.1.0" }
tokimo-bus-client     = { path = "crates/client",     version = "0.1.0" }
tokimo-bus-broker     = { path = "crates/broker",     version = "0.1.0" }
tokimo-bus-supervisor = { path = "crates/supervisor", version = "0.1.0" }
tokimo-bus-auth       = { path = "crates/auth",       version = "0.1.0" }
tokimo-bus-cli        = { path = "crates/cli",        version = "0.1.0" }

[workspace.lints.rust]
unsafe_code     = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_imports        = "allow"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
items_after_statements  = "allow"
struct_excessive_bools  = "allow"
similar_names           = "allow"
many_single_char_names  = "allow"
unnecessary_literal_bound = "allow"
doc_markdown            = "allow"
ref_option              = "allow"
fn_params_excessive_bools = "allow"
needless_pass_by_value  = "allow"
cast_possible_wrap      = "allow"
cast_possible_truncation = "allow"
cast_precision_loss     = "allow"
cast_sign_loss          = "allow"
unwrap_in_result = "warn"
panic            = "warn"
todo             = "warn"
dbg_macro        = "warn"
print_stdout     = "warn"
print_stderr     = "warn"
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
