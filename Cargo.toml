[workspace]
members = [
    "crates/protocol",
    "crates/client",
    "crates/broker",
    "crates/supervisor",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.80"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/tokimo-lab/tokimo-bus"
authors      = ["Tokimo Lab"]

[workspace.dependencies]
tokio          = { version = "1.38", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "process", "signal", "fs"] }
serde          = { version = "1", features = ["derive"] }
rmp-serde      = "1.3"
thiserror      = "1.0"
tracing        = "0.1"
parking_lot    = "0.12"
dashmap        = "6"
futures        = "0.3"
async-trait    = "0.1"

tokimo-bus-protocol   = { path = "crates/protocol",   version = "0.1.0" }
tokimo-bus-client     = { path = "crates/client",     version = "0.1.0" }
tokimo-bus-broker     = { path = "crates/broker",     version = "0.1.0" }
tokimo-bus-supervisor = { path = "crates/supervisor", version = "0.1.0" }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
