[package]
name = "tokimo-bus-auth"
version.workspace = true
edition = "2024"
rust-version.workspace = true

[features]
default = ["axum", "cli"]
axum = ["dep:axum"]
cli = ["dep:reqwest", "dep:clap", "dep:dirs"]
cli-db = ["dep:sea-orm", "dep:sha2", "dep:hex", "dep:chrono", "dep:uuid", "dep:dotenvy", "dep:tokio"]

[dependencies]
axum = { version = "0.8", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", optional = true, features = ["derive", "env"] }
dirs = { version = "5", optional = true }
sea-orm = { version = "2.0.0-rc.37", optional = true, default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono", "macros"] }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
chrono = { version = "0.4", optional = true, features = ["serde"] }
uuid = { version = "1", optional = true, features = ["v4", "serde"] }
dotenvy = { version = "0.15", optional = true }
tokio = { version = "1", optional = true, features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[lints]
workspace = true
